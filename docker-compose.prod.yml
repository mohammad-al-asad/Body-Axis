services:
  api:
    build:
      context: ./api
    env_file:
      - ./deploy/api.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - bodyaxis

  admin:
    build:
      context: ./dashboard
      args:
        VITE_API_URL: ${DASHBOARD_API_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - bodyaxis

networks:
  bodyaxis:
    driver: bridge
