name: EC2 CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ec2-deploy.yml"
      - "api/**"
      - "dashboard/**"
      - "deploy/**"
      - "docker-compose.prod.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ec2-deploy.yml"
      - "api/**"
      - "dashboard/**"
      - "deploy/**"
      - "docker-compose.prod.yml"
  workflow_dispatch:

concurrency:
  group: ec2-production-deploy
  cancel-in-progress: false

jobs:
  api-ci:
    name: API CI
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Validate API imports
        run: python -m compileall api

  dashboard-ci:
    name: Dashboard CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Lint dashboard
        run: npm run lint

      - name: Build dashboard
        run: npm run build

  deploy:
    name: Deploy To EC2
    runs-on: ubuntu-latest
    needs:
      - api-ci
      - dashboard-ci
    if: github.event_name != 'pull_request'
    environment:
      name: production

    steps:
      - name: Configure SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf "%s" "$EC2_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Trust EC2 host key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          ssh-keyscan -p "${EC2_PORT:-22}" -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy latest main to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_PATH: ${{ secrets.EC2_APP_PATH }}
        run: |
          ssh -p "${EC2_PORT:-22}" "${EC2_USER}@${EC2_HOST}" "bash -lc '
            set -euo pipefail
            cd \"${EC2_APP_PATH}\"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            ./deploy/scripts/deploy-ec2.sh
          '"
